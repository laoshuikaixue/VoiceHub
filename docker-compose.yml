services:
  voicehub:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      # 密钥一律从 .env 注入，无默认值：示例值公开可查，等同于无密钥
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL 必须设置，参考 .env.example}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须设置，执行 openssl rand -base64 48 生成}
      - NODE_ENV=production
      - SKIP_BUILD=true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile: Dockerfile-postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=voicehub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d voicehub']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
