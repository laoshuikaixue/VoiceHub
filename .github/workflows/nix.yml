name: Nix CI

on:
  # push 仅在非文档变更时跑，纯文档提交跳过以节省 CI 分钟数；
  # pull_request 不过滤，保证分支保护的必需检查每次都存在
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-check:
    name: 构建校验与 pnpmDeps 哈希同步
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      # PR 统一从基仓库检出 refs/pull/<n>/head，fork 的提交也能取到
      CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref_name }}
      # 哈希更新写回的目标分支
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      # fork PR 与 bot 自身触发的运行不允许写回
      CAN_SYNC: ${{ github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - name: 检出触发代码
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: 安装 Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: 配置 Cachix 二进制缓存
        uses: cachix/cachix-action@v17
        with:
          name: voicehub
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: 构建 voicehub（哈希过期时自动同步）
        id: build
        shell: bash
        run: |
          set -euo pipefail

          build_log="${RUNNER_TEMP:-/tmp}/nix-build.log"
          hash_log="${RUNNER_TEMP:-/tmp}/nix-build-hash.log"

          if nix build .#voicehub --no-link --print-build-logs 2>&1 | tee "$build_log"; then
            echo "构建成功，pnpmDeps 哈希无需更新。"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Eq 'hash mismatch|got:[[:space:]]+sha256-|ERR_PNPM_' "$build_log"; then
            echo "构建失败，且与 pnpm 依赖无关，不做哈希同步。"
            exit 1
          fi

          if [ "${CAN_SYNC}" != "true" ]; then
            echo "::error::pnpmDeps 哈希已过期，但当前运行无权写回（fork PR 或 bot 触发）。请按 README 的步骤在本地更新 flake.nix 中的哈希后重试。"
            exit 1
          fi

          echo "::notice::检测到 pnpmDeps 哈希过期，正在计算新哈希"

          # 置空哈希后重建，从 Nix 的哈希不匹配报错中取真实哈希
          python3 scripts/ci-update-pnpm-hash.py --empty

          if nix build .#voicehub --no-link --print-build-logs 2>&1 | tee "$hash_log"; then
            echo "::error::空哈希下构建意外成功，无法提取新的 pnpmDeps 哈希。"
            exit 1
          fi

          new_hash="$(grep -Eo 'got:[[:space:]]+sha256-[A-Za-z0-9+/=_-]+' "$hash_log" | tail -n 1 | sed -E 's/got:[[:space:]]+//' || true)"

          if [ -z "$new_hash" ]; then
            echo "::error::没有在 Nix 输出中找到 got: sha256-...，请人工检查 flake.nix 与 pnpm-lock.yaml。"
            exit 1
          fi

          python3 scripts/ci-update-pnpm-hash.py --set "$new_hash"

          if git diff --quiet -- flake.nix; then
            echo "::error::计算出的哈希与现有值相同，构建失败与哈希无关。"
            exit 1
          fi

          echo "新的 pnpmDeps 哈希: $new_hash"
          echo "synced=true" >> "$GITHUB_OUTPUT"

      - name: 提交、验证并推送哈希更新
        if: steps.build.outputs.synced == 'true'
        shell: bash
        run: |
          set -euo pipefail

          verify_log="${RUNNER_TEMP:-/tmp}/nix-build-verify.log"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "ci: 同步 pnpmDeps 哈希"

          # 提交后工作树干净，先在新哈希下验证构建再推送
          if nix build .#voicehub --no-link --print-build-logs 2>&1 | tee "$verify_log"; then
            verify_status=0
          else
            verify_status=$?
          fi

          if [ "$verify_status" -ne 0 ] && grep -Eq 'hash mismatch|ERR_PNPM_' "$verify_log"; then
            echo "::error::按新哈希构建仍因 pnpm 依赖失败，已跳过推送，请人工检查 flake.nix 与 pnpm-lock.yaml。"
            exit 1
          fi

          if ! git push origin "HEAD:${TARGET_BRANCH}"; then
            echo "::error::推送 pnpmDeps 哈希更新失败，目标分支可能有新提交。"
            exit 1
          fi
          echo "已推送 pnpmDeps 哈希更新。"

          if [ "$verify_status" -ne 0 ]; then
            echo "::error::哈希更新后构建仍然失败，请查看上方日志。"
            exit 1
          fi

      - name: 运行 nix flake check
        run: nix flake check

      - name: 求值 NixOS 模块冒烟检查
        # flake check 不实例化 systemd.services，模块字段拼写与脚本转义错误要到真机才暴露；
        # 这里求值关键字段并构建启动脚本做关键字断言（秒级，不构建完整包）
        shell: bash
        run: |
          set -euo pipefail
          export FLAKE_REF="git+file://${GITHUB_WORKSPACE}"
          expr_file="${RUNNER_TEMP}/nixos-module-smoke.nix"
          cat > "$expr_file" <<'EOF'
          let
            f = builtins.getFlake (builtins.getEnv "FLAKE_REF");
            pkgs = import f.inputs.nixpkgs { system = "x86_64-linux"; };
            pkg = f.outputs.packages.x86_64-linux.default;
            cfg = {
              enable = true;
              port = 3000;
              host = "0.0.0.0";
              package = pkg;
              database = { createLocally = true; name = "voicehub"; user = "voicehub"; host = "/run/postgresql"; };
              environmentFile = null;
              extraEnvironment = { };
              runDeployScript = true;
              openFirewall = false;
            };
            mod = f.outputs.nixosModules.default { config = { services.voicehub = cfg; }; lib = pkgs.lib; pkgs = pkgs; };
          in
          mod.config.content.systemd.services.voicehub
          EOF

          [ "$(nix eval --impure --file "$expr_file" serviceConfig.WorkingDirectory --raw)" = "-/var/lib/voicehub" ] \
            || { echo "::error::WorkingDirectory 不是 -/var/lib/voicehub"; exit 1; }
          [ "$(nix eval --impure --file "$expr_file" serviceConfig.StateDirectory --raw)" = "voicehub" ] \
            || { echo "::error::StateDirectory 不是 voicehub"; exit 1; }

          script="$(nix build --impure --file "$expr_file" serviceConfig.ExecStart --print-out-paths --no-link | tail -n 1)"
          for keyword in 'ln -sfT' 'STATE_DIRECTORY' 'PGHOST' 'node scripts/deploy.js'; do
            grep -qF "$keyword" "$script" || { echo "::error::启动脚本缺关键字: $keyword"; exit 1; }
          done
          # pnpm run 依赖 PATH 中的 sh，bash 被移出 makeBinPath 时启动脚本会以 exit -2 静默死亡
          grep -qE 'export PATH="[^"]*bash' "$script" || { echo "::error::启动脚本 PATH 缺少 bash"; exit 1; }
          echo "✅ NixOS 模块冒烟检查通过"
