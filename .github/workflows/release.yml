# .github/workflows/release.yml
# 发布入口：
#   1) 手动运行并填版本号 —— 由本工作流提交 Bump Version、打 tag 并发布 Release
#      （版本号留空则沿用 package.json 当前版本，不产生 Bump 提交）
#   2) 推送版本号 tag —— 直接在该 tag 上发布 Release
# 产物：运行包（.output + 迁移与管理脚本，文件集对齐 Dockerfile 运行阶段）+ 飞牛 FPK

name: Release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号'
        required: false
        type: string

permissions:
  contents: write

env:
  # 与 Dockerfile 的 node:24-alpine 保持一致
  NODE_VERSION: '24'

jobs:
  prepare:
    # 允许在 fork 上手动 dispatch 验证；tag 推送仅在主仓库生效，
    # github.actor 守卫跳过本工作流自己推送的 tag，避免重复发布
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'laoshuikaixue/VoiceHub' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 解析版本号、提交 Bump 并打 tag
        id: resolve
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VER="${VERSION_INPUT:-$PKG_VER}"
          else
            VER="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "❌ 版本号格式不合法: $VER（应为 x.y.z 或 x.y.z.w）"
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$VER" != "$PKG_VER" ]; then
              TAG_SHA=$(git rev-parse -q --verify "refs/tags/$VER^{commit}" || true)
              if [ -n "$TAG_SHA" ]; then
                # tag 已存在：指向当前提交的后代即为上次运行所建，跳过 Bump 按 tag 续跑；
                # 与当前提交无关或 tag 内版本不符则视为重复发布既有版本
                if ! git merge-base --is-ancestor HEAD "$TAG_SHA"; then
                  echo "❌ tag $VER 已存在（${TAG_SHA:0:8}）且与当前提交无关，$PKG_VER 无法再发布为 $VER"
                  exit 1
                fi
                TAG_VER=$(git show "$TAG_SHA:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' || true)
                if [ "$TAG_VER" != "$VER" ]; then
                  echo "❌ tag $VER 已存在（${TAG_SHA:0:8}）但其提交内版本为 ${TAG_VER:-未知}，拒绝复用"
                  exit 1
                fi
                echo "⚠️ tag $VER 已由上次运行创建（${TAG_SHA:0:8}），跳过 Bump 按 tag 内容重跑"
              else
                node -e '
                  const fs = require("fs");
                  const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
                  pkg.version = process.argv[1];
                  fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
                ' "$VER"

                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add package.json
                git commit -m "Bump Version"
                if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
                  echo "❌ 推送 Bump Version 失败，${GITHUB_REF_NAME} 分支可能有新提交"
                  exit 1
                fi
                echo "✅ 已提交 Bump Version: $PKG_VER -> $VER"
              fi
            fi

            HEAD_SHA=$(git rev-parse HEAD)
            TAG_SHA=$(git rev-parse -q --verify "refs/tags/$VER^{commit}" || true)
            if [ -n "$TAG_SHA" ]; then
              # 上次运行可能在 prepare 之后中断；tag 内容即发布内容，按其指向的提交重跑
              if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
                echo "⚠️ tag $VER 指向 ${TAG_SHA:0:8}，与当前提交 ${HEAD_SHA:0:8} 不同，按 tag 内容发布"
              fi
              COMMIT="$TAG_SHA"
            else
              git tag "$VER"
              git push origin "refs/tags/$VER"
              COMMIT="$HEAD_SHA"
            fi
          else
            COMMIT="${GITHUB_SHA}"
          fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "📦 发布版本: $VER @ ${COMMIT:0:8}"

  build-app:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      # setup-node v5 会按 packageManager 自动探测并调用包管理器做依赖缓存，
      # 因此 pnpm 必须先于 Node 安装；版本沿用 package.json 的 packageManager
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖并构建
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: 打包发布产物
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -d .output/server || { echo "❌ 构建产物缺失"; exit 1; }

          # 文件集对齐 Dockerfile 运行阶段：除 .output 外，迁移与管理脚本仍需源文件
          STAGE="staging/voicehub"
          mkdir -p "$STAGE/app" "$STAGE/server/utils"
          cp -r .output "$STAGE/.output"
          cp -r app/drizzle "$STAGE/app/drizzle"
          cp -r scripts "$STAGE/scripts"
          cp -r docker-compose "$STAGE/docker-compose"
          cp drizzle.config.ts package.json pnpm-lock.yaml pnpm-workspace.yaml .env.example "$STAGE/"
          # db.ts 运行时依赖该模块（tsx 直跑源码），缺失时 deploy 阶段的 create-admin 报 ERR_MODULE_NOT_FOUND
          cp server/utils/serverless-runtime.ts "$STAGE/server/utils/"

          # 与 Dockerfile CMD 一致：先同步数据库再启动，PREBUILT 跳过安装与构建
          cat > "$STAGE/start.sh" <<'EOS'
          #!/bin/sh
          # 首次使用请先安装生产依赖: pnpm install --prod --frozen-lockfile
          set -e
          export PREBUILT=true
          node scripts/deploy.js
          exec node .output/server/index.mjs
          EOS
          chmod +x "$STAGE/start.sh"

          # 剔除构建平台（amd64）的 esbuild 二进制副本：与 Dockerfile 运行阶段一致，
          # 删除后按目标平台安装的生产依赖 node_modules/esbuild 生效
          rm -rf "$STAGE/.output/server/node_modules/esbuild" "$STAGE/.output/server/node_modules/@esbuild"

          # 产物按 amd64 平台构建（.output 内其余文件为 JS/资源，跨架构通用），文件名保留架构后缀
          tar -czf "voicehub-${VERSION}-amd64.tar.gz" -C staging voicehub
          rm -rf staging
          ls -lh voicehub-*.tar.gz

      - name: 上传 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-bundle
          path: voicehub-*.tar.gz
          retention-days: 30

  build-fpk:
    needs: prepare
    uses: ./.github/workflows/build-fpk.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  release:
    needs: [prepare, build-app, build-fpk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          # 需要完整历史与 tag 才能对比上一版本判断是否含数据库变更
          fetch-depth: 0

      - name: 下载全部 Artifact
        uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true

      - name: 生成校验和与发布说明
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          cd assets
          sha256sum voicehub-*.tar.gz *.fpk > checksums.txt
          cat checksums.txt

          # 变更说明沿用 GitHub 原生生成结果（内容等价 generate_release_notes）。
          # 自行拼接是因为 GitHub 会把原生说明追加在 body 之后，无法把附件校验和真正放到末尾
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$VERSION" \
            -f target_commitish="$COMMIT" \
            --jq '.body' > generated-notes.md

          # 迁移文件或 schema 有变更才改动线上库结构，此时才提示备份
          DB_CHANGED=false
          PREV_TAG=$(git -C "$GITHUB_WORKSPACE" describe --tags --abbrev=0 "${COMMIT}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            DB_DIFF=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$PREV_TAG" "$COMMIT" -- app/drizzle/migrations app/drizzle/schema.ts || true)
            if [ -n "$DB_DIFF" ]; then
              DB_CHANGED=true
            fi
          fi
          echo "数据库变更: $DB_CHANGED（对比 ${PREV_TAG:-无}）"

          # 备份提示需紧跟 “What's Changed” 列表、位于 New Contributors / Full Changelog 之前，
          # 故在生成的说明里定位首个后续小节，在其前插入 warning
          INSERT_LINE=$(grep -n -m1 -E '^(## New Contributors|\*\*Full Changelog)' generated-notes.md | cut -d: -f1 || true)
          if [ -n "$INSERT_LINE" ]; then
            head -n $((INSERT_LINE - 1)) generated-notes.md > notes-prefix.md
            tail -n +"$INSERT_LINE" generated-notes.md > notes-suffix.md
          else
            cp generated-notes.md notes-prefix.md
            : > notes-suffix.md
          fi

          {
            cat notes-prefix.md
            if [ "$DB_CHANGED" = true ]; then
              echo '> [!WARNING]  '
              echo '> 本版本涉及数据库更新，请务必提前备份数据。'
              echo
            fi
            cat notes-suffix.md
            echo
            echo '---'
            echo
            echo '## 附件 SHA-256'
            echo
            echo '```text'
            cat checksums.txt
            echo '```'
          } > release-body.md

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          files: |
            assets/voicehub-*.tar.gz
            assets/*.fpk
            assets/checksums.txt
          body_path: assets/release-body.md
          # 变更说明已在上一步生成并拼进 body，避免 GitHub 再次追加导致顺序错乱
          generate_release_notes: false
          overwrite_files: true

  # 发布完成后显式触发 Docker 镜像构建：Bump 提交由 GITHUB_TOKEN 推送，
  # 不会触发 push 类工作流（workflow_dispatch 是例外），需主动调度；
  # 仅主仓库执行（fork 手动测试按设计跳过），调度失败可仅重跑本 job
  trigger-docker:
    needs: [prepare, release]
    if: github.repository == 'laoshuikaixue/VoiceHub'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 触发 Docker 镜像构建
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-build.yml --ref "${{ github.event.repository.default_branch }}" --repo "$GITHUB_REPOSITORY"
